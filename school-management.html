<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة المدارس</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏫%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#4f46e5;--pri2:#4338ca;--pt:#eef2ff;--bg:#f9fafb;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--bad:#dc2626;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
aside{width:260px;flex:none;background:#fff;border-inline-end:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
aside h1{margin:0;padding:22px 20px;border-bottom:1px solid var(--line);font-size:1.4rem;color:var(--pri)}
aside nav{padding:14px;display:flex;flex-direction:column;gap:6px}
aside nav a{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:10px;color:var(--mute)}
aside nav a:hover{background:var(--bg);color:var(--ink)}
aside nav a.on{background:var(--pt);color:var(--pri2);font-weight:700}
main{flex:1;min-width:0;padding:24px;max-width:1100px}
.mb{display:none;position:fixed;top:12px;inset-inline-end:12px;z-index:50;width:46px;height:46px;border-radius:12px;border:0;background:#fff;box-shadow:0 2px 8px #0002;font-size:1.4rem;color:var(--pri)}
.ov{display:none;position:fixed;inset:0;background:#0007;z-index:30}
@media(max-width:800px){
 aside{position:fixed;inset-block:0;inset-inline-end:0;transform:translateX(100%);transition:transform .25s}
 aside.open{transform:none}aside.open~.ov{display:block}
 .mb{display:block}main{padding:70px 14px 40px}
}
h2{margin:0;font-size:1.8rem}
h3{margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 18px}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:500}
.btn.p:hover{background:var(--pri2)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.box h3{margin-bottom:12px;font-size:1.15rem}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #cbd0d8;border-radius:10px;padding:9px 12px}
:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.rel{position:relative}
.cl{display:block}
.top{display:flex;gap:14px;align-items:flex-start}
.ic{width:52px;height:52px;flex:none;border-radius:12px;background:var(--pt);display:grid;place-items:center;font-size:1.5rem}
.sq{width:52px;height:52px;flex:none;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.av{width:64px;height:64px;flex:none;border-radius:50%;background:var(--pt);display:grid;place-items:center;font-size:1.5rem;overflow:hidden;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:1.1rem;line-height:1.5}
.m{color:var(--mute);font-size:.88rem}
.sch{color:var(--pri);font-size:.92rem}
.ft{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:.9rem;color:#4b5563}
.acts{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:2px}
.ib{border:0;background:none;font-size:1.05rem;padding:4px 6px;border-radius:8px}
.ib:hover{background:var(--bg)}
.kv div{padding:1px 0}
.kv a{color:var(--pri)}
.hero{background:linear-gradient(135deg,#4f46e5,#3b82f6);color:#fff;border-radius:18px;padding:30px;margin-bottom:20px}
.hero h2{font-size:1.9rem;margin-bottom:6px}.hero p{margin:0;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-inline-start:6px solid var(--c);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center}
.stat i{font-style:normal;font-size:1.8rem}.stat b{display:block;font-size:2.1rem;line-height:1.1}.stat span{color:var(--mute);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.sb{margin-bottom:16px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;border:1px dashed #d1d5db;border-radius:14px;background:#fff}
.back{display:inline-block;color:var(--pri);margin-bottom:10px}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:18px}
.dg h4{margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dh{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dh .sq,.dh .ic{width:96px;height:96px;font-size:2.4rem}
.ev{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;position:relative}
.ev h4{margin:0 0 2px;padding-inline-end:70px}
.ev p{margin:8px 0 0;white-space:pre-wrap}
.tg{display:inline-block;background:var(--pt);color:var(--pri2);border-radius:99px;padding:0 10px;font-size:.82rem;margin-top:6px}
#m{display:none;position:fixed;inset:0;background:#0007;z-index:100;overflow:auto;padding:20px 12px}
#m.on{display:block}
#fm{background:#fff;max-width:720px;margin:0 auto;border-radius:16px;padding:22px}
#fm h3{font-size:1.5rem;margin-bottom:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.f label{display:block;font-size:.88rem;font-weight:500;margin-bottom:3px}
.ck{display:flex;align-items:center;gap:8px}.ck input{width:20px;height:20px}
.pho{display:flex;gap:12px;align-items:center}
.chk{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px}.chk label{display:flex;gap:6px;align-items:center;font-weight:400}.chk input{width:auto}
@media(max-width:560px){.fg{grid-template-columns:1fr}}
/* التقرير */
#rep{background:#fff;color:#111;border:1px solid var(--line);border-radius:14px;padding:24px 28px}
.rh{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;align-items:start;padding-bottom:20px;border-bottom:2px solid #1f2a44;font-weight:500}
.rh h1{margin:0;text-align:center;font-size:1.35rem}
.rb{min-height:260px;padding:18px 0;border-bottom:2px solid #1f2a44}
.rd{text-align:center;font-size:1.7rem;line-height:1.5;margin:6px 0 14px}
.rn{text-align:center;font-size:1.7rem;margin-top:70px}.rb.e .rd{margin-top:70px;margin-bottom:0}.rb.e .rn{margin-top:0}
.re{border:1px solid #777;border-radius:8px;padding:10px 14px;margin-bottom:10px;break-inside:avoid}
.reh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reh .n{width:26px;height:26px;border:2px solid #1f2a44;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.reh .s{margin-inline-start:auto;font-weight:500}
.re p{margin:6px 0 0;white-space:pre-wrap;font-size:.95rem}
.re .x{font-size:.9rem;margin-top:4px}
.rf{display:flex;justify-content:space-between;padding-top:14px;font-weight:500}
.rf b{display:block;color:#2a3f8f;margin-top:28px;font-weight:500}
@media print{
 @page{size:A4;margin:12mm}
 aside,.mb,.ov,.noprint,#m{display:none!important}
 body{background:#fff}main{padding:0;max-width:none}
 #rep{border:0;border-radius:0;padding:0}
}
</style>
</head>
<body>
<div class="app">
  <button class="mb noprint" data-a="menu" aria-label="القائمة">☰</button>
  <aside>
    <h1>🏫 إدارة المدارس</h1>
    <nav>
      <a href="#/" data-p="home">🏠 الرئيسية</a>
      <a href="#/schools" data-p="schools">🏫 المدارس</a>
      <a href="#/teachers" data-p="teachers">👥 المعلمون والموظفون</a>
      <a href="#/report" data-p="report">📄 تقرير الأحداث اليومية</a>
    </nav>
  </aside>
  <div class="ov" data-a="menu"></div>
  <main id="main"></main>
</div>
<div id="m"></div>
<input type="file" id="sp" accept="image/*" hidden>
<input type="file" id="mp" accept="image/*" hidden>
<input type="file" id="imf" accept=".json,application/json" hidden>

<script>
var KEY="school-mgmt-v1";
var DB={schools:[],teachers:[],events:[],seq:1,settings:{gov:"المنيا",adm:"سمالوط التعليمية",sec:"مصطفى محمود",mgr:""}};
var S={q:""},listFn=null,RD="",mctx=null,mphoto="",spId=null;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
RD=today();
function loadDB(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);DB.schools=o.schools||[];DB.teachers=o.teachers||[];DB.events=o.events||[];DB.seq=o.seq||1;DB.settings=Object.assign(DB.settings,o.settings||{})}}catch(e){}}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){alert("تعذر حفظ البيانات في هذا المتصفح (قد تكون المساحة ممتلئة أو التخزين معطّل).")}}
function sname(id){var s=DB.schools.filter(function(x){return x.id==id})[0];return s?s.name:"مدرسة غير معروفة"}
function tel(v){return v?'<a href="tel:'+esc(v)+'">'+esc(v)+'</a>':""}
var STL={"اصلى":"أصلي"};

/* ===== تعريف النماذج (نفس حقول البرنامج الأصلي) ===== */
var SPEC={
schools:{label:"مدرسة",F:[
["name","اسم المدرسة","text",0,1],["code","الكود","text",0,1],["address","العنوان","text",1],
["principal_name","اسم المدير"],["principal_phone","رقم هاتف المدير","tel"],
["deputy_name","اسم الوكيل"],["deputy_phone","رقم هاتف الوكيل","tel"],
["security_name","مسئول الأمن"],["security_phone","رقم مسئول الأمن","tel"],
["crisis_manager_name","مسئول الأزمات والكوارث"],["crisis_manager_phone","رقم هاتف مسئول الأزمات","tel"],
["workers_info","بيانات العمال (الأسماء والأرقام)","area",1],
["has_cameras","يوجد كاميرات؟","check",1],["cameras_count","عدد الكاميرات","num"],
["extinguishers_count","عدد الطفايات","num"],["hoses_count","عدد الخراطيم","num"],
["buildings_count","عدد المباني","num"],["total_staff_count","إجمالي الموظفين","num"]]},
teachers:{label:"معلم أو موظف",F:[
["school_id","المدرسة","ref",1,1],["name","الاسم","text",0,1],["national_id","الرقم القومي"],
["code","الكود"],["phone","رقم الهاتف","tel"],["address","العنوان","text",1],
["job_grade","الدرجة الوظيفية"],["role","العمل داخل المدرسة"],
["employment_status","حالة العمل","sel:اصلى:أصلي|منتدب:منتدب|معار:معار|متعاقد:متعاقد"],
["photo_url","صورة المعلم","photo"],["notes","ملاحظات","area",1]]},
events:{label:"حدث",F:[
["title","عنوان الحدث","text",1,1],["event_date","تاريخ الحدث","date",1,1],
["description","تفاصيل الحدث والإجراء المتخذ","area",1,1],
["involved_teachers","المعلمون المعنيون","teachers",1],["involved_students","الطلاب المعنيون","area",1]]}
};

function fld(f,o){
  var k=f[0],l=f[1],t=f[2]||"text",full=f[3],req=f[4],v=o[k]==null?"":o[k],c="f"+(full?" full":""),w='data-w="'+k+'"',i;
  if(t==="check")return '<label class="'+c+' ck" '+w+'><input type="checkbox" name="'+k+'" '+(o[k]?"checked":"")+'> '+l+'</label>';
  if(t==="area")i='<textarea name="'+k+'" rows="3" '+(req?"required":"")+'>'+esc(v)+'</textarea>';
  else if(t==="ref")i='<select name="'+k+'" '+(req?"required":"")+'><option value="">اختر المدرسة</option>'+DB.schools.map(function(s){return '<option value="'+s.id+'" '+(s.id==v?"selected":"")+'>'+esc(s.name)+'</option>'}).join("")+'</select>';
  else if(t.indexOf("sel:")===0)i='<select name="'+k+'">'+t.slice(4).split("|").map(function(x){var p=x.split(":");return '<option value="'+p[0]+'" '+(p[0]==v?"selected":"")+'>'+p[1]+'</option>'}).join("")+'</select>';
  else if(t==="photo")i='<div class="pho"><div class="av" id="pv">'+(mphoto?'<img src="'+mphoto+'" alt="">':"👤")+'</div><button type="button" class="btn" data-a="mphoto">'+(mphoto?"تغيير الصورة":"رفع صورة")+'</button></div>';
  else if(t==="teachers"){
    var names=v?String(v).split("،").map(function(x){return x.trim()}).filter(Boolean):[];
    var T=DB.teachers.filter(function(x){return x.school_id==o.school_id}),known=T.map(function(x){return x.name});
    var extra=names.filter(function(n){return known.indexOf(n)<0}).join("، ");
    i='<div class="chk">'+(T.map(function(x){return '<label><input type="checkbox" name="tch" value="'+esc(x.name)+'" '+(names.indexOf(x.name)>=0?"checked":"")+'> '+esc(x.name)+'</label>'}).join("")||'<span class="m">لا يوجد معلمون مسجلون لهذه المدرسة</span>')+'</div><input name="tex" placeholder="أسماء أخرى (اختياري) — افصل بينها بـ ،" value="'+esc(extra)+'">';
  }
  else i='<input name="'+k+'" type="'+(t==="num"?"number":t)+'" '+(t==="num"?'min="0"':"")+' value="'+esc(v)+'" '+(req?"required":"")+'>';
  return '<div class="'+c+'" '+w+'><label>'+l+'</label>'+i+'</div>';
}
function openM(kind,id,pre){
  var sp=SPEC[kind],o=id?DB[kind].filter(function(x){return x.id==id})[0]:Object.assign(kind==="events"?{event_date:today()}:{},pre||{});
  if(!o)return;
  mctx={kind:kind,id:id?+id:null,school_id:o.school_id};mphoto=o.photo_url||"";
  $("#m").innerHTML='<form id="fm"><h3>'+(id?"تعديل ":"إضافة ")+sp.label+'</h3><div class="fg">'+sp.F.map(function(f){return fld(f,o)}).join("")+'</div><div class="row"><button class="btn p" type="submit">حفظ</button><button class="btn" type="button" data-a="closem">إلغاء</button></div></form>';
  $("#m").classList.add("on");
  var cb=$("#fm").elements.has_cameras;
  if(cb){var sync=function(){var w=$("#fm").querySelector('[data-w="cameras_count"]');if(w)w.style.display=cb.checked?"":"none"};cb.onchange=sync;sync()}
  $("#fm").onsubmit=function(e){e.preventDefault();saveM()};
}
function saveM(){
  var kind=mctx.kind,id=mctx.id,f=$("#fm").elements,d={};
  SPEC[kind].F.forEach(function(x){var k=x[0],t=x[2]||"text";
    if(t==="check")d[k]=f[k].checked;
    else if(t==="photo")d[k]=mphoto;
    else if(t==="teachers"){var a=[].map.call(document.querySelectorAll('#fm [name="tch"]:checked'),function(e){return e.value});var ex=f.tex.value.split("،").map(function(e){return e.trim()}).filter(Boolean);d[k]=a.concat(ex).join("، ")}
    else if(t==="num")d[k]=parseInt(f[k].value,10)||0;
    else if(t==="ref")d[k]=+f[k].value;
    else d[k]=f[k].value.trim();
  });
  if(kind==="events")d.school_id=mctx.school_id;
  if(id){Object.assign(DB[kind].filter(function(x){return x.id==id})[0],d)}
  else{d.id=DB.seq++;DB[kind].push(d)}
  saveDB();ACT.closem();render();
}
function delRec(kind,id){
  var o=DB[kind].filter(function(x){return x.id==id})[0];if(!o)return;
  var msg=kind==="schools"?'هل أنت متأكد من حذف مدرسة "'+o.name+'"؟ سيتم حذف جميع المعلمين والأحداث المرتبطة بها.':kind==="teachers"?'هل أنت متأكد من حذف "'+o.name+'"؟':'هل أنت متأكد من حذف حدث "'+o.title+'"؟';
  if(!confirm(msg))return;
  DB[kind]=DB[kind].filter(function(x){return x.id!=id});
  if(kind==="schools"){DB.teachers=DB.teachers.filter(function(x){return x.school_id!=id});DB.events=DB.events.filter(function(x){return x.school_id!=id});if(location.hash.indexOf("#/schools/")===0)location.hash="#/schools"}
  saveDB();render();
}
function shrink(file,max){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.75))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ===== مكونات العرض ===== */
function acts(k,i){return '<div class="acts"><button class="ib" title="تعديل" data-a="edit" data-k="'+k+'" data-i="'+i+'">✏️</button><button class="ib" title="حذف" data-a="del" data-k="'+k+'" data-i="'+i+'">🗑️</button></div>'}
function head(t,b,k){return '<div class="ph"><h2>'+t+'</h2><button class="btn p" data-a="add" data-k="'+k+'">＋ '+b+'</button></div>'}
function sbox(ph){return '<div class="box sb"><input id="q" placeholder="'+ph+'" value="'+esc(S.q)+'"></div>'}
function empty(t){return '<div class="empty">'+t+'</div>'}
function stat(i,l,n,c){return '<div class="stat" style="--c:'+c+'"><i>'+i+'</i><div><b>'+n+'</b><span>'+l+'</span></div></div>'}
function evItem(e,showSchool){
  return '<div class="ev">'+acts("events",e.id)+'<h4>'+esc(e.title)+'</h4><div class="m">'+esc(e.event_date)+(showSchool?' — <a class="sch" href="#/schools/'+e.school_id+'">'+esc(sname(e.school_id))+'</a>':"")+'</div>'
   +(e.description?'<p>'+esc(e.description)+'</p>':"")
   +(e.involved_teachers?'<div class="tg">المعلمون: '+esc(e.involved_teachers)+'</div> ':"")
   +(e.involved_students?'<div class="tg">الطلاب: '+esc(e.involved_students)+'</div>':"")+'</div>';
}
function byDate(a,b){return (b.event_date||"")>(a.event_date||"")?1:(b.event_date||"")<(a.event_date||"")?-1:b.id-a.id}
function schoolCard(s){
  var n=s.total_staff_count||DB.teachers.filter(function(t){return t.school_id==s.id}).length;
  return '<div class="card rel"><a class="cl" href="#/schools/'+s.id+'"><div class="top">'+(s.photo?'<img class="sq" src="'+s.photo+'" alt="">':'<div class="ic">🏫</div>')
   +'<div><h3>'+esc(s.name)+'</h3><div class="m">كود: '+esc(s.code)+'</div><div class="m">'+esc(s.address)+'</div></div></div>'
   +'<div class="ft"><span>المدير: '+esc(s.principal_name||"غير محدد")+'</span><span>الموظفين: '+n+'</span></div></a>'+acts("schools",s.id)+'</div>';
}
function teacherCard(t){
  function r(l,v){return '<div>'+l+': '+(v||"—")+'</div>'}
  return '<div class="card rel"><div class="top"><div class="av">'+(t.photo_url?'<img src="'+t.photo_url+'" alt="">':"👤")+'</div><div style="padding-inline-end:56px"><h3>'+esc(t.name)+'</h3><a class="sch" href="#/schools/'+t.school_id+'">'+esc(sname(t.school_id))+'</a><div class="m">'+esc(t.role||"")+(t.role?" - ":"")+esc(STL[t.employment_status]||t.employment_status||"")+'</div></div></div>'
   +'<div class="kv" style="margin-top:12px">'+r("الرقم القومي",esc(t.national_id))+r("الكود",esc(t.code))+r("الهاتف",tel(t.phone))+r("الدرجة",esc(t.job_grade))+(t.address?r("العنوان",esc(t.address)):"")+(t.notes?r("ملاحظات",esc(t.notes)):"")+'</div>'+acts("teachers",t.id)+'</div>';
}

/* ===== الصفحات ===== */
var PAGES={
home:function(){
  var t=DB.events.filter(function(e){return e.event_date===today()}).length;
  var rec=DB.events.slice().sort(byDate).slice(0,5);
  return '<div class="hero"><h2>مرحباً بك في نظام إدارة المدارس</h2><p>لوحة تحكم لمتابعة المدارس والمعلمين والأحداث اليومية بإدارة '+esc(DB.settings.adm)+'.</p></div>'
   +'<div class="stats">'+stat("🏫","إجمالي المدارس",DB.schools.length,"#3b82f6")+stat("👥","إجمالي الموظفين",DB.teachers.length,"#16a34a")+stat("📌","أحداث اليوم",t,"#9333ea")+'</div>'
   +'<div class="box"><h3>آخر الأحداث</h3>'+(rec.length?rec.map(function(e){return evItem(e,true)}).join(""):'<div class="m">لا توجد أحداث مسجلة بعد. افتح مدرسة من قسم "المدارس" لإضافة حدث.</div>')+'</div>'
   +'<div class="box noprint"><h3>النسخ الاحتياطي</h3><p class="m">البيانات محفوظة داخل هذا المتصفح فقط. صدّر نسخة احتياطية بشكل دوري، أو انقل بياناتك إلى جهاز آخر عبر الاستيراد.</p><div class="row"><button class="btn p" data-a="export">تصدير نسخة احتياطية</button><button class="btn" data-a="import">استيراد نسخة</button></div></div>';
},
schools:function(){
  listFn=function(){var q=S.q,L=DB.schools.filter(function(s){return (s.name||"").indexOf(q)>=0||(s.code||"").indexOf(q)>=0});return L.length?'<div class="grid">'+L.map(schoolCard).join("")+'</div>':empty(DB.schools.length?"لا توجد نتائج مطابقة.":"لا توجد مدارس بعد. اضغط «إضافة مدرسة» للبدء.")};
  return head("المدارس","إضافة مدرسة","schools")+sbox("ابحث باسم المدرسة أو الكود...")+'<div id="list">'+listFn()+'</div>';
},
teachers:function(){
  listFn=function(){var q=S.q,L=DB.teachers.filter(function(t){return [t.name,t.national_id,t.code,t.phone,sname(t.school_id)].join(" ").indexOf(q)>=0});return L.length?'<div class="grid">'+L.map(teacherCard).join("")+'</div>':empty(DB.teachers.length?"لا توجد نتائج مطابقة.":(DB.schools.length?"لا يوجد معلمون بعد. اضغط «إضافة» للبدء.":"أضف مدرسة أولًا ثم سجّل المعلمين والموظفين."))};
  return head("المعلمون والموظفون","إضافة معلم أو موظف","teachers")+sbox("ابحث بالاسم، الرقم القومي، أو المدرسة...")+'<div id="list">'+listFn()+'</div>';
},
school:function(id){
  var s=DB.schools.filter(function(x){return x.id==id})[0];
  if(!s)return '<div class="box">المدرسة غير موجودة. <a class="sch" href="#/schools">العودة للمدارس</a></div>';
  var T=DB.teachers.filter(function(t){return t.school_id==s.id}),E=DB.events.filter(function(e){return e.school_id==s.id}).sort(byDate);
  function p(l,n,ph){return '<p><span class="m">'+l+':</span> '+esc(n||"غير محدد")+(ph?'<br><span class="m">'+tel(ph)+'</span>':"")+'</p>'}
  return '<a class="back" href="#/schools">→ المدارس</a>'
   +'<div class="box rel">'+acts("schools",s.id)+'<div class="dh"><div style="position:relative">'+(s.photo?'<img class="sq" src="'+s.photo+'" alt="">':'<div class="ic">🏫</div>')+'<button class="ib" style="position:absolute;bottom:-6px;inset-inline-end:-6px;background:var(--pri);color:#fff;border-radius:50%" title="تغيير صورة المدرسة" data-a="sphoto" data-i="'+s.id+'">📷</button></div><div><h2>'+esc(s.name)+'</h2><div class="m">كود: '+esc(s.code)+(s.address?" | "+esc(s.address):"")+'</div></div></div>'
   +'<div class="dg"><div><h4>الإدارة</h4>'+p("المدير",s.principal_name,s.principal_phone)+p("الوكيل",s.deputy_name,s.deputy_phone)+'</div>'
   +'<div><h4>الأمن والعمال والأزمات</h4>'+p("مسئول الأمن",s.security_name,s.security_phone)+p("مسئول الأزمات والكوارث",s.crisis_manager_name,s.crisis_manager_phone)+'<p style="white-space:pre-wrap"><span class="m">العمال:</span> '+esc(s.workers_info||"لا يوجد بيانات")+'</p></div>'
   +'<div><h4>المرافق والإحصائيات</h4><p>📷 كاميرات: '+(s.has_cameras?"نعم ("+(s.cameras_count||0)+")":"لا")+'</p><p>🧯 طفايات / خراطيم: '+(s.extinguishers_count||0)+" / "+(s.hoses_count||0)+'</p><p>🏢 مباني: '+(s.buildings_count||0)+'</p><p>👥 إجمالي الموظفين: '+(s.total_staff_count||T.length)+'</p></div></div></div>'
   +'<div class="box"><div class="ph" style="margin-bottom:12px"><h3>📅 سجل الأحداث للمدرسة</h3><button class="btn p" data-a="evadd" data-i="'+s.id+'">＋ إضافة حدث جديد</button></div>'+(E.length?E.map(function(e){return evItem(e,false)}).join(""):'<div class="m">لا توجد أحداث مسجلة لهذه المدرسة.</div>')+'</div>'
   +'<div class="box"><h3>👥 معلمو وموظفو المدرسة ('+T.length+')</h3>'+(T.length?T.map(function(t){return '<div style="padding:4px 0;border-top:1px solid var(--line)"><b>'+esc(t.name)+'</b> <span class="m">'+esc(t.role||"")+(t.role?" - ":"")+esc(STL[t.employment_status]||t.employment_status||"")+'</span> '+tel(t.phone)+'</div>'}).join(""):'<div class="m">لا يوجد معلمون مسجلون. أضفهم من قسم «المعلمون والموظفون».</div>')+'</div>';
},
report:function(){
  var s=DB.settings;
  return '<div class="ph noprint"><h2>تقرير الأحداث اليومية</h2><button class="btn p" data-a="print">🖨️ طباعة التقرير</button></div>'
   +'<div class="box noprint"><div class="fg"><div class="f full"><label>اختر التاريخ</label><input type="date" id="rd" value="'+RD+'"></div>'
   +[["gov","المحافظة"],["adm","الإدارة التعليمية"],["sec","إعداد / مسئول الأمن"],["mgr","يعتمد / مدير الإدارة"]].map(function(f){return '<div class="f"><label>'+f[1]+'</label><input data-s="'+f[0]+'" value="'+esc(s[f[0]])+'"></div>'}).join("")
   +'</div></div><div id="rep">'+reportHtml()+'</div>';
}
};
function reportHtml(){
  var s=DB.settings,p=RD.split("-"),dn=new Date(RD+"T00:00:00").toLocaleDateString("ar-EG",{weekday:"long"});
  var ev=DB.events.filter(function(e){return e.event_date===RD}).sort(function(a,b){return a.id-b.id});
  var d='<div class="rd">'+dn+" "+p[0]+"/"+(+p[1])+"/"+(+p[2])+'</div>';
  var body=ev.length?d+ev.map(function(e,i){
    return '<div class="re"><div class="reh"><span class="n">'+(i+1)+'</span><b>'+esc(e.title)+'</b><span class="s">'+esc(sname(e.school_id))+'</span></div>'
     +(e.description?'<p>'+esc(e.description)+'</p>':"")
     +(e.involved_teachers?'<div class="x"><b>المعلمون المعنيون:</b> '+esc(e.involved_teachers)+'</div>':"")
     +(e.involved_students?'<div class="x"><b>الطلاب المعنيون:</b> '+esc(e.involved_students)+'</div>':"")+'</div>';
  }).join(""):d+'<div class="rn">لا توجد احداث بالادارة</div>';
  return '<div class="rh"><div>محافظة: '+esc(s.gov)+'<br>إدارة: '+esc(s.adm)+'</div><h1>تقرير الأحداث اليومية للمدارس</h1><div></div></div>'
   +'<div class="rb'+(ev.length?"":" e")+'">'+body+'</div>'
   +'<div class="rf"><div>إعداد / مسئول الأمن<b>'+esc(s.sec)+'&nbsp;</b></div><div>يعتمد / مدير الإدارة<b>'+(esc(s.mgr)||"........................")+'</b></div></div>';
}

/* ===== التوجيه والأحداث ===== */
function render(){
  var r=location.hash.replace(/^#\/?/,"").split("/"),p=r[0]||"home",key=p==="schools"&&r[1]?"school":p;
  if(!PAGES[key]){key="home";p="home"}
  [].forEach.call(document.querySelectorAll("aside nav a"),function(a){a.classList.toggle("on",a.dataset.p===p)});
  $("#main").innerHTML=PAGES[key](r[1]);
}
window.addEventListener("hashchange",function(){S.q="";$("aside").classList.remove("open");render();window.scrollTo(0,0)});
var ACT={
  menu:function(){$("aside").classList.toggle("open")},
  add:function(i,t){openM(t.dataset.k,null,{})},
  edit:function(i,t){openM(t.dataset.k,i)},
  del:function(i,t){delRec(t.dataset.k,i)},
  evadd:function(i){openM("events",null,{school_id:+i})},
  sphoto:function(i){spId=i;$("#sp").click()},
  mphoto:function(){$("#mp").click()},
  print:function(){window.print()},
  closem:function(){$("#m").classList.remove("on")},
  export:function(){
    var b=new Blob([JSON.stringify(DB)],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="school-data-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
  },
  import:function(){$("#imf").click()}
};
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");
  if(t&&ACT[t.dataset.a]){e.preventDefault();ACT[t.dataset.a](t.dataset.i,t,e);return}
  if(e.target.id==="m")ACT.closem();
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){S.q=t.value.trim();$("#list").innerHTML=listFn()}
  else if(t.dataset&&t.dataset.s){DB.settings[t.dataset.s]=t.value;saveDB();$("#rep").innerHTML=reportHtml()}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="rd"){RD=t.value||RD;$("#rep").innerHTML=reportHtml()}
  else if(t.id==="sp"&&t.files[0]){
    shrink(t.files[0],500).then(function(u){var s=DB.schools.filter(function(x){return x.id==spId})[0];if(s){s.photo=u;saveDB();render()}}).catch(function(){alert("حدث خطأ أثناء رفع الصورة")});t.value="";
  }
  else if(t.id==="mp"&&t.files[0]){
    shrink(t.files[0],260).then(function(u){mphoto=u;var pv=$("#pv");if(pv)pv.innerHTML='<img src="'+u+'" alt="">'}).catch(function(){alert("حدث خطأ أثناء رفع الصورة")});t.value="";
  }
  else if(t.id==="imf"&&t.files[0]){
    var r=new FileReader();r.onload=function(){
      try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.schools)||!Array.isArray(o.teachers)||!Array.isArray(o.events))throw 0;
        if(!confirm("سيتم استبدال البيانات الحالية ببيانات النسخة الاحتياطية. هل تريد المتابعة؟"))return;
        DB.schools=o.schools;DB.teachers=o.teachers;DB.events=o.events;DB.seq=o.seq||1;DB.settings=Object.assign(DB.settings,o.settings||{});saveDB();render();alert("تم استيراد البيانات بنجاح.")}
      catch(x){alert("الملف غير صالح. اختر ملف نسخة احتياطية صدّرته من هذا البرنامج.")}
    };r.readAsText(t.files[0]);t.value="";
  }
});
loadDB();render();
</script>
</body>
